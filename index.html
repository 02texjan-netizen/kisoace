<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>キソエース配置・数量集計</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#192536;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#142a43;color:#fff;padding:13px 16px;display:flex;justify-content:space-between;gap:8px;align-items:center}header strong{font-size:17px}.pill{font-size:11px;background:#345a76;border-radius:20px;padding:5px 9px}main{max-width:1350px;margin:auto;padding:10px}.panel{background:white;border:1px solid #dce3ec;border-radius:12px;padding:12px;margin-bottom:10px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:end}label{font-size:12px;color:#4b5b6c;display:block;margin-bottom:4px}select,input,button{font-size:15px;min-height:40px;border-radius:8px;border:1px solid #c8d3df;padding:7px;background:#fff}input[type=number]{width:105px}button{cursor:pointer;font-weight:600}button.primary{background:#1769aa;color:white;border-color:#1769aa}button.active{background:#dceeff;border-color:#1769aa;color:#07538a}.group{display:flex;gap:5px;flex-wrap:wrap}.hint{font-size:12px;color:#536679;line-height:1.5;margin-top:9px}.workspace{position:relative;overflow:auto;overscroll-behavior:contain;border:1px solid #c7d2df;border-radius:9px;background:#dfe5ec;touch-action:none;height:min(60vh,650px)}.stage{position:relative}.sheet{position:absolute;left:0;top:0;transform-origin:0 0;line-height:0;user-select:none;-webkit-user-select:none;touch-action:none}.sheet img{display:block;width:100%;height:100%;pointer-events:none}.sheet svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:10px}.counts{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13px}.counts div{border-bottom:1px solid #e8edf2;padding:4px 0}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;border:1px solid #667}.status{font-size:12px;color:#526274;margin:8px 0}.action{display:flex;flex-wrap:wrap;gap:6px}.action button{font-size:12px}footer{color:#617083;font-size:11px;padding:8px 12px 20px}@media(max-width:850px){.layout{grid-template-columns:1fr}.workspace{height:55vh}main{padding:8px}.panel{padding:10px}header strong{font-size:15px}}@media print{header,.tools,.right,footer{display:none!important}main{padding:0}.layout{display:block}.panel{border:0;padding:0}.workspace{overflow:visible;height:auto;border:0}.stage{width:100%!important;height:auto!important}.sheet{position:relative;transform:none!important;width:100%!important;height:auto!important;aspect-ratio:var(--ratio)}.sheet img{height:auto}.sheet svg{height:100%}@page{size:A3 landscape;margin:6mm}}
</style></head><body><header><strong>キソエース配置・数量集計</strong><span class="pill">ピンチ・自由移動・ホイール対応</span></header><main><section class="panel tools"><div class="hint"><strong>図面は端末内で読み込みます。GitHubには送信されません。</strong> PDFは1ページ目を表示します（PDF表示にはインターネット接続が必要）。</div><p><label>図面を選択（PDF / JPG / PNG） <input type="file" id="planFile" accept="application/pdf,image/jpeg,image/png,image/webp" style="max-width:100%"></label></p><div class="toolbar"><div><label>配置品番</label><select id="part"></select></div><div><label>操作モード</label><div class="group" id="modes"><button data-mode="tap" class="active">● タップ</button><button data-mode="line">↔ 連続配置</button><button data-mode="cal">📏 縮尺設定</button><button data-mode="move">✥ 丸を移動</button><button data-mode="pen">✎ 手書き</button><button data-mode="straight">／ 直線</button><button data-mode="pan">✋ 図面を動かす</button><button data-mode="erase">線を消す</button><button data-mode="del">消去</button></div></div><div><label>ペン色・太さ</label><input id="penColor" type="color" value="#e32636" style="width:55px;padding:3px;vertical-align:middle"><select id="penWidth"><option value="2">細</option><option value="5" selected>中</option><option value="10">太</option></select></div><div><label>配置方向</label><select id="direction"><option value="h">横方向</option><option value="v">縦方向</option></select></div><div><label>ピッチ(mm)</label><input id="pitch" type="number" min="1" value="1000"></div><div><label>個数</label><input id="num" type="number" min="1" max="200" value="5"></div><div><label>図面操作</label><div class="group" style="align-items:center"><button id="zoomOut" type="button">－</button><button id="zoomIn" type="button">＋</button><button id="reset" type="button">全体表示</button><span id="zoomLabel" style="font-size:13px;min-width:46px;text-align:center">100%</span></div><div class="hint">2本指で拡大縮小。✋図面を動かすモードで上下左右へドラッグ。PCはマウスホイールで拡大縮小</div></div></div><div id="instruction" class="hint">図面を読み込み、タップして丸印を配置できます。</div></section><div class="layout"><section class="panel"><div class="workspace" id="work"><div class="stage" id="stage"><div class="sheet" id="sheet"><img id="bg" alt="図面"><svg id="overlay" viewBox="0 0 1965 1390" preserveAspectRatio="none"></svg></div></div></div><div id="status" class="status">縮尺未設定／追加済み0個</div></section><aside class="panel right"><strong>品番別数量（登録分）</strong><p class="hint">元図面に印刷された丸印は未集計です。</p><div class="counts" id="counts"></div><p class="hint" id="total"></p><div class="action tools"><button id="undo">1つ戻す</button><button id="clear">全消去</button><button id="save" class="primary">編集データ保存</button><button id="loadBtn">保存データ読込</button><input type="file" id="load" accept="application/json,.json" hidden><button id="csv">数量CSV出力</button><button id="svgBtn">配置図SVG出力</button><button onclick="window.print()">配置図を印刷/PDF保存</button></div><p class="hint">保存したJSONを読み込めます。図面自体は別途読み込んでください。</p></aside></div></main><footer>試作版。作業終了前に「編集データ保存」を押してください。図面の既存マークは自動計数しません。</footer><script>
'use strict';
const $=id=>document.getElementById(id),work=$('work'),stage=$('stage'),sheet=$('sheet'),svg=$('overlay');
const parts=[['AH-0305','#22a65a'],['AH-0711','#ec8b2c'],['AH-1421','#d31e6e'],['AH-2027','#135de5'],['AH-2532','#e5d11c'],['AH-3542','#ffffff']];
let W=1965,H=1390,marks=[],strokes=[],mode='tap',calibration=null,calStart=null,history=[],planLoaded=false,scale=1,baseWidth=700,gesture=null,blockedClick=false,pinch=null;let padX=0,padY=0;
parts.forEach(([id])=>{const o=document.createElement('option');o.value=id;o.textContent=id;$('part').append(o)});
function dimensions(){
 baseWidth=Math.max(1,work.clientWidth);
 // Keep the drawing at the viewport origin. Safari may ignore the initial
 // programmatic scroll into large empty padding, leaving only a gray panel.
 padX=0;padY=0;
 sheet.style.width=baseWidth+'px';sheet.style.height=(baseWidth*H/W)+'px';
 sheet.style.setProperty('--ratio',W+'/'+H);updateStage();
}
function updateStage(){
 const width=baseWidth*scale,height=baseWidth*H/W*scale;
 stage.style.width=(width+2*padX)+'px';stage.style.height=(height+2*padY)+'px';
 sheet.style.left=padX+'px';sheet.style.top=padY+'px';
 sheet.style.transform=`scale(${scale})`;
 $('zoomLabel').textContent=Math.round(scale*100)+'%';
}
function zoomTo(next,cx,cy){
 const wr=work.getBoundingClientRect(),sr=sheet.getBoundingClientRect();
 const localX=(cx-sr.left)/scale,localY=(cy-sr.top)/scale;
 scale=Math.max(0.5,Math.min(12,next));updateStage();
 work.scrollLeft=padX+localX*scale-(cx-wr.left);
 work.scrollTop=padY+localY*scale-(cy-wr.top);
}
function zoomButton(f){const r=work.getBoundingClientRect();zoomTo(scale*f,r.left+work.clientWidth/2,r.top+work.clientHeight/2)}
function resetZoom(){scale=1;updateStage();work.scrollLeft=0;work.scrollTop=0}
$('zoomIn').onclick=()=>zoomButton(1.3);$('zoomOut').onclick=()=>zoomButton(1/1.3);$('reset').onclick=resetZoom;
work.addEventListener('wheel',e=>{if(!planLoaded)return;e.preventDefault();zoomTo(scale*(e.deltaY<0?1.12:1/1.12),e.clientX,e.clientY)},{passive:false});
function setPlan(src,w,h){W=w;H=h;marks=[];strokes=[];calibration=null;calStart=null;history=[];planLoaded=true;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);$('bg').onload=()=>{dimensions();resetZoom();$('instruction').textContent='図面を表示しました。拡大後は「✋ 図面を動かす」で上下左右へ移動できます。'};$('bg').onerror=()=>{$('instruction').textContent='図面画像の表示に失敗しました。画像を再選択してください。'};$('bg').src=src;dimensions();resetZoom();render()}
async function loadPlan(e){const f=e.target.files?.[0];if(!f)return;try{if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){if(!window.pdfjsLib){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=resolve;s.onerror=reject;document.head.append(s)})}pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,page=await pdf.getPage(1),v=page.getViewport({scale:1}),vp=page.getViewport({scale:Math.min(2,2200/v.width)}),canvas=document.createElement('canvas');canvas.width=Math.round(vp.width);canvas.height=Math.round(vp.height);await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;setPlan(canvas.toDataURL('image/jpeg',.9),canvas.width,canvas.height)}else if(f.type.startsWith('image/')){const url=URL.createObjectURL(f),img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});const c=document.createElement('canvas'),sc=Math.min(1,2200/img.naturalWidth);c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);setPlan(c.toDataURL('image/jpeg',.92),c.width,c.height)}else throw Error('PDFか画像を選んでください')}catch(err){alert('図面を読み込めませんでした：'+err.message)}}
$('planFile').addEventListener('change',loadPlan);
const descriptions={tap:'タップ配置：置きたい場所をタップ。',line:'連続配置：起点をタップすると指定ピッチで配置します。縮尺設定が必要です。',cal:'縮尺設定：実寸が分かる2点を順番にタップ。',move:'丸を移動：丸印をドラッグ。',pen:'手書き：指やマウスで線を描きます。',straight:'直線：始点から終点までドラッグ。',pan:'図面を動かす：1本指やマウスで移動。',erase:'線を消す：線をタップ。',del:'消去：丸印をタップ。'};
function modeSet(m){mode=m;calStart=null;gesture=null;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('instruction').textContent=descriptions[m];render()}
$('modes').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)modeSet(b.dataset.mode)});
function snapshot(){history.push(JSON.stringify({marks,strokes,calibration}));if(history.length>50)history.shift()}
function getXY(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function render(){let out='';for(const st of strokes){if(st.points.length<2)continue;out+=`<polyline points="${st.points.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="${st.color}" stroke-width="${st.width}" stroke-linecap="round" stroke-linejoin="round"/>`}for(const m of marks){const color=parts.find(p=>p[0]===m.part)?.[1]||'#d31e6e';out+=`<circle cx="${m.x}" cy="${m.y}" r="${Math.max(5,W/260)}" fill="${color}" stroke="#15222d" stroke-width="1.4" opacity=".94"/>`}if(calStart)out+=`<circle cx="${calStart.x}" cy="${calStart.y}" r="9" fill="none" stroke="#00aaff" stroke-width="3"/>`;svg.innerHTML=out;const c={};parts.forEach(p=>c[p[0]]=0);marks.forEach(m=>{if(c[m.part]!==undefined)c[m.part]++});$('counts').innerHTML=parts.map(([p,color])=>`<div><span class="dot" style="background:${color}"></span>${p}</div><div><b>${c[p]}</b> 個</div>`).join('');$('total').textContent='追加済み合計：'+marks.length+' 個';$('status').textContent=(calibration?'縮尺設定済み（1px = '+calibration.toFixed(3)+' mm）':'縮尺未設定')+' ／追加済み'+marks.length+'個'}
function closestMark(p){let best=-1,dist=Infinity;marks.forEach((m,i)=>{const d=Math.hypot(m.x-p.x,m.y-p.y);if(d<dist){dist=d;best=i}});return dist<Math.max(18,W/70)?best:-1}
function segmentDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function clickAt(e){if(!planLoaded){alert('最初に図面を読み込んでください');return}if(blockedClick)return;const p=getXY(e);if(['move','pen','straight','pan'].includes(mode))return;if(mode==='tap'){snapshot();marks.push({...p,part:$('part').value})}else if(mode==='del'){const i=closestMark(p);if(i>=0){snapshot();marks.splice(i,1)}}else if(mode==='cal'){if(!calStart){calStart=p}else{const d=Math.hypot(p.x-calStart.x,p.y-calStart.y),v=prompt('選択した2点間の実寸(mm)を入力してください','1000');if(v!==null&&Number(v)>0&&d>1){snapshot();calibration=Number(v)/d}calStart=null}}else if(mode==='line'){if(!calibration){alert('先に縮尺設定をしてください');return}const pitch=Number($('pitch').value),n=Math.floor(Number($('num').value));if(!(pitch>0&&n>=1&&n<=200)){alert('ピッチと個数を確認してください');return}const step=pitch/calibration,dir=$('direction').value,next=Array.from({length:n},(_,i)=>({x:p.x+(dir==='h'?i*step:0),y:p.y+(dir==='v'?i*step:0),part:$('part').value}));if(next.some(m=>m.x<0||m.x>W||m.y<0||m.y>H)){alert('配置範囲が図面の外に出ます');return}snapshot();marks.push(...next)}else if(mode==='erase'){const i=strokes.findIndex(st=>st.points.some((a,j)=>j&&segmentDist(p,st.points[j-1],a)<Math.max(12,W/120)));if(i>=0){snapshot();strokes.splice(i,1)}}render()}
// Touch gestures are handled independently of pointer events. This avoids Safari's
// pointer-capture conflict when a second finger lands on the drawing.
const touchPoint=t=>({x:t.clientX,y:t.clientY});
const touchMid=(a,b)=>({x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2});
const touchDist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
work.addEventListener('touchstart',e=>{if(e.touches.length===2){
 e.preventDefault();gesture=null;blockedClick=true;down=null;
 const a=e.touches[0],b=e.touches[1],mid=touchMid(a,b),sr=sheet.getBoundingClientRect();
 pinch={distance:Math.max(1,touchDist(a,b)),startScale:scale,
  anchorX:(mid.x-sr.left)/scale,anchorY:(mid.y-sr.top)/scale};
}},{capture:true,passive:false});
work.addEventListener('touchmove',e=>{if(e.touches.length>=2&&pinch){
 e.preventDefault();const a=e.touches[0],b=e.touches[1],mid=touchMid(a,b),r=work.getBoundingClientRect();
 scale=Math.max(.5,Math.min(12,pinch.startScale*touchDist(a,b)/pinch.distance));updateStage();
 work.scrollLeft=padX+pinch.anchorX*scale-(mid.x-r.left);
 work.scrollTop=padY+pinch.anchorY*scale-(mid.y-r.top);
}},{capture:true,passive:false});
work.addEventListener('touchend',e=>{if(pinch&&e.touches.length<2){pinch=null;gesture=null;blockedClick=true;setTimeout(()=>blockedClick=false,400)}},{capture:true});
work.addEventListener('touchcancel',()=>{pinch=null;gesture=null;blockedClick=true;setTimeout(()=>blockedClick=false,400)},{capture:true});
svg.addEventListener('pointerdown',e=>{if(!planLoaded||pinch||e.isPrimary===false)return;if(!['move','pen','straight','pan'].includes(mode))return;e.preventDefault();const p=getXY(e);if(mode==='pan'){gesture={type:'pan',id:e.pointerId,x:e.clientX,y:e.clientY,left:work.scrollLeft,top:work.scrollTop}}else if(mode==='move'){const i=closestMark(p);if(i<0)return;snapshot();gesture={type:'move',id:e.pointerId,i}}else{snapshot();strokes.push({color:$('penColor').value,width:Number($('penWidth').value)*W/900,points:[p,p]});gesture={type:mode,id:e.pointerId}}svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId||pinch)return;e.preventDefault();const p=getXY(e);p.x=Math.max(0,Math.min(W,p.x));p.y=Math.max(0,Math.min(H,p.y));if(gesture.type==='pan'){work.scrollLeft=gesture.left+gesture.x-e.clientX;work.scrollTop=gesture.top+gesture.y-e.clientY}else if(gesture.type==='move'){marks[gesture.i].x=p.x;marks[gesture.i].y=p.y}else if(gesture.type==='straight'){strokes[strokes.length-1].points[1]=p}else{strokes[strokes.length-1].points.push(p)}render()});
function endPointer(e){if(gesture&&gesture.id===e.pointerId){gesture=null;blockedClick=true;setTimeout(()=>blockedClick=false,180)}}
svg.addEventListener('pointerup',endPointer);svg.addEventListener('pointercancel',endPointer);
// Use pointerup for single-tap placement, not synthetic click after pinch.
let down=null;svg.addEventListener('pointerdown',e=>{if(!e.isPrimary||pinch)return;if(['tap','del','cal','line','erase'].includes(mode))down={id:e.pointerId,x:e.clientX,y:e.clientY}});
svg.addEventListener('pointerup',e=>{if(!down||down.id!==e.pointerId)return;const d=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(d<12&&!pinch&&!blockedClick)clickAt(e)});
$('undo').onclick=()=>{if(history.length){const a=JSON.parse(history.pop());marks=a.marks;strokes=a.strokes||[];calibration=a.calibration;render()}};
$('clear').onclick=()=>{if(confirm('追加した丸印と線をすべて削除しますか？')){snapshot();marks=[];strokes=[];render()}};
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
$('save').onclick=()=>download('キソエース配置データ.json',new Blob([JSON.stringify({version:4,W,H,marks,strokes,calibration},null,2)],{type:'application/json'}));
$('loadBtn').onclick=()=>$('load').click();$('load').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.marks))throw Error('形式が違います');if(planLoaded&&d.W&&d.H&&(d.W!==W||d.H!==H)&&!confirm('保存時と図面サイズが異なります。読み込みますか？'))return;snapshot();marks=d.marks.filter(m=>parts.some(p=>p[0]===m.part)&&Number.isFinite(m.x)&&Number.isFinite(m.y));strokes=Array.isArray(d.strokes)?d.strokes.filter(st=>Array.isArray(st.points)&&/^#[0-9a-f]{6}$/i.test(st.color)&&Number.isFinite(st.width)).map(st=>({...st,points:st.points.filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y))})):[];calibration=Number.isFinite(d.calibration)?d.calibration:null;render()}catch(err){alert('読み込めませんでした：'+err.message)}finally{e.target.value=''}});
$('csv').onclick=()=>{const rows=[['品番','数量'],...parts.map(([p])=>[p,marks.filter(m=>m.part===p).length]),['合計',marks.length]];download('キソエース品番別数量.csv',new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}))};
$('svgBtn').onclick=()=>{if(!planLoaded){alert('図面を読み込んでください');return}const xml=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><image href="${$('bg').src}" width="${W}" height="${H}"/>${svg.innerHTML}</svg>`;download('キソエース配置図.svg',new Blob([xml],{type:'image/svg+xml'}))};
window.addEventListener('resize',()=>{const sr=sheet.getBoundingClientRect(),wr=work.getBoundingClientRect();const x=(wr.left+work.clientWidth/2-sr.left)/(baseWidth*scale),y=(wr.top+work.clientHeight/2-sr.top)/(baseWidth*H/W*scale);dimensions();work.scrollLeft=padX+x*baseWidth*scale-work.clientWidth/2;work.scrollTop=padY+y*baseWidth*H/W*scale-work.clientHeight/2});
$('bg').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1965" height="1390"><rect width="100%" height="100%" fill="#eef2f7"/><text x="50%" y="50%" text-anchor="middle" font-size="48" fill="#536679">図面を選択してください</text></svg>');dimensions();render();
</script></body></html>
